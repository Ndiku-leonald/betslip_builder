name: SlipIQ CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: alembic -c alembic.ini upgrade head
      - run: python -m pytest tests
      - run: pip install bandit pip-audit
      - run: bandit -r app -lll
      - run: pip-audit -r requirements.txt

  migrations-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: slipiq
          POSTGRES_PASSWORD: slipiq-ci
          POSTGRES_DB: slipiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slipiq -d slipiq"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql+psycopg://slipiq:slipiq-ci@localhost:5432/slipiq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Upgrade PostgreSQL schema
        run: alembic -c alembic.ini upgrade head
      - name: Downgrade PostgreSQL schema
        run: alembic -c alembic.ini downgrade base
      - name: Re-upgrade PostgreSQL schema
        run: alembic -c alembic.ini upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: npm audit (review required for known upstream advisories)
        run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile .
      - run: docker build -f apps/web/Dockerfile .

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
